<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Bewegungs-Reminder</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --fg: #1d1d1f;
    --card: #ffffff;
    --border: #d2d2d7;
    --accent: #2f7ff2;
    --accent-fg: #ffffff;
    --muted: #6e6e73;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1f;
      --fg: #f2f2f2;
      --card: #2a2a2c;
      --border: #3d3d3f;
      --muted: #9a9a9e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .row:last-child { margin-bottom: 0; }
  .row[hidden] { display: none; }
  label.field-label {
    font-size: 13px;
    font-weight: 500;
  }
  select, input[type="time"] {
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
  }
  .time-range {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .time-range span {
    font-size: 12px;
    color: var(--muted);
  }

  .sound-picker {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    font-size: 12px;
  }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn:active { opacity: 0.7; }
  .switch {
    position: relative;
    width: 40px;
    height: 24px;
    flex: none;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--border);
    border-radius: 24px;
    transition: 0.15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.15s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(16px); }

  .days {
    display: flex;
    gap: 6px;
    justify-content: space-between;
  }
  .day-toggle {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    color: var(--muted);
  }
  .day-toggle.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }

  .next-info {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  button#save {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#save:active { opacity: 0.85; }

  #status {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 16px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }
  .tab-panel[hidden] { display: none; }

  .messages-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    max-height: 280px;
    overflow-y: auto;
  }
  .message-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .message-input {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
  }
  .remove-message {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .remove-message:hover { color: #e5484d; border-color: #e5484d; }

  button.add-message-btn {
    margin-top: 10px;
    width: 100%;
    padding: 8px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Bewegungs-Reminder</h1>
  <p class="subtitle">Erinnert dich in regelmäßigen Abständen, aufzustehen und dich zu bewegen.</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="general">Allgemein</button>
    <button type="button" class="tab-btn" data-tab="messages">Nachrichten</button>
  </div>

  <div class="tab-panel" id="tab-general">
    <div class="card">
      <div class="row">
        <span class="field-label">Reminder aktiv</span>
        <label class="switch">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span class="field-label">Automatisch starten (bei Login)</span>
        <label class="switch">
          <input type="checkbox" id="autostart" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span class="field-label">Pausieren bei Abwesenheit</span>
        <label class="switch">
          <input type="checkbox" id="skipWhenIdle" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span class="field-label">Intervall</span>
        <select id="interval">
          <option value="0.16666666666666666">Alle 10 Sekunden (Test)</option>
          <option value="15">Alle 15 Minuten</option>
          <option value="30">Alle 30 Minuten</option>
          <option value="45">Alle 45 Minuten</option>
          <option value="60">Jede Stunde</option>
          <option value="90">Alle 90 Minuten</option>
          <option value="120">Alle 2 Stunden</option>
        </select>
      </div>
      <div class="row">
        <span class="field-label">Zeitfenster</span>
        <div class="time-range">
          <input type="time" id="startTime" />
          <span>bis</span>
          <input type="time" id="endTime" />
        </div>
      </div>
      <div class="row">
        <span class="field-label">Anzeige</span>
        <select id="displayMode">
          <option value="notification">Kurze Benachrichtigung</option>
          <option value="fullscreen">Vollbild-Overlay</option>
        </select>
      </div>
      <div class="row" id="soundPickerRow">
        <span class="field-label">Ton</span>
        <div class="sound-picker">
          <select id="sound">
            <option value="none">Kein Ton</option>
            <option value="chime">Chime</option>
            <option value="ping">Ping</option>
            <option value="bell">Glocke</option>
            <option value="rising">Aufsteigend</option>
          </select>
          <button type="button" id="playSound" class="icon-btn" title="Vorhören">▶</button>
        </div>
      </div>
      <div class="row" id="soundToggleRow" hidden>
        <span class="field-label">Ton bei Erinnerung</span>
        <label class="switch">
          <input type="checkbox" id="soundToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <span class="field-label">Wochentage</span>
      <div class="days" id="days">
        <div class="day-toggle" data-day="mon">Mo</div>
        <div class="day-toggle" data-day="tue">Di</div>
        <div class="day-toggle" data-day="wed">Mi</div>
        <div class="day-toggle" data-day="thu">Do</div>
        <div class="day-toggle" data-day="fri">Fr</div>
        <div class="day-toggle" data-day="sat">Sa</div>
        <div class="day-toggle" data-day="sun">So</div>
      </div>
      <div class="next-info" id="nextInfo"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-messages" hidden>
    <div class="card">
      <span class="field-label">Nachrichten (eine wird zufällig gewählt)</span>
      <div class="messages-list" id="messagesList"></div>
      <button type="button" id="addMessage" class="add-message-btn">+ Nachricht hinzufügen</button>
    </div>
  </div>

  <button id="save">Speichern</button>
  <div id="status"></div>

  <script src="settings.js"></script>
</body>
</html>
